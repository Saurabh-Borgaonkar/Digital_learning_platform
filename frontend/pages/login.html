<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — NexLearn</title>
  <meta name="description" content="Login to your NexLearn account to access your courses, assignments, and certificates.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-[#FDF8F3] min-h-screen flex flex-col">

<!-- Navbar -->
<header class="bg-[#FDF8F3] shadow-sm">
  <div class="max-w-7xl mx-auto px-6">
    <div class="flex items-center justify-between h-20">
      <a href="../pages/index.html">
        <img src="../assets/logo.png" alt="NexLearn" class="h-12 w-auto object-contain">
      </a>
      <a href="../pages/register.html" class="text-gray-600 hover:text-lime-600 font-medium transition">
        Don't have an account? <span class="text-lime-600 font-semibold">Register</span>
      </a>
    </div>
  </div>
</header>

<!-- Login Form -->
<main class="flex-1 flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-3xl shadow-xl p-8 md:p-10">

      <!-- Header -->
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-lime-500 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-4">🎓</div>
        <h1 class="text-2xl font-bold text-gray-900">Welcome Back!</h1>
        <p class="text-gray-500 text-sm mt-2">Login to continue your learning journey</p>
      </div>

      <!-- Error Message -->
      <div id="errorMsg" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm mb-6"></div>

      <!-- Form -->
      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2" for="email">Email Address</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
              <i data-lucide="mail" class="w-5 h-5"></i>
            </span>
            <input
              type="email" id="email" name="email" required
              placeholder="you@example.com"
              class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-lime-400 focus:border-transparent text-gray-700 text-sm"
            >
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2" for="password">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
              <i data-lucide="lock" class="w-5 h-5"></i>
            </span>
            <input
              type="password" id="password" name="password" required
              placeholder="••••••••"
              class="w-full pl-10 pr-12 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-lime-400 focus:border-transparent text-gray-700 text-sm"
            >
            <button type="button" id="togglePass" class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-gray-600">
              <i data-lucide="eye" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

        <button
          type="submit" id="loginBtn"
          class="w-full bg-lime-500 hover:bg-lime-600 text-black font-semibold py-3 rounded-xl transition shadow-sm flex items-center justify-center gap-2"
        >
          <span id="btnText">Login</span>
          <span id="btnSpinner" class="hidden">
            <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
            </svg>
          </span>
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center gap-4 my-6">
        <hr class="flex-1 border-gray-200">
        <span class="text-gray-400 text-sm">or</span>
        <hr class="flex-1 border-gray-200">
      </div>

      <!-- Register link -->
      <p class="text-center text-gray-600 text-sm">
        New to NexLearn?
        <a href="/pages/register.html" class="text-lime-600 font-semibold hover:underline">Create a free account</a>
      </p>

      <!-- Demo Credentials -->
      <div class="mt-6 bg-lime-50 border border-lime-200 rounded-xl p-4 text-xs text-gray-600">
        <p class="font-semibold text-lime-700 mb-2">🔑 Demo Credentials</p>
        <p>Admin: admin@nexlearn.com / admin123</p>
        <p>Teacher: teacher@nexlearn.com / teacher123</p>
        <p>Student: student@nexlearn.com / student123</p>
      </div>
    </div>
  </div>
</main>
<script>
  lucide.createIcons();

  // Toggle password visibility
  document.getElementById('togglePass').addEventListener('click', () => {
    const passInput = document.getElementById('password');
    passInput.type = passInput.type === 'password' ? 'text' : 'password';
  });

  // Login form submit
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    errorMsg.classList.add('hidden');
    btnText.textContent = 'Logging in...';
    btnSpinner.classList.remove('hidden');

    try {
      const response = await fetch('http://localhost:5000/api/auth/login', {
  method: 'POST',
  headers: {
    'Content-Type': 'application/json'
  },
  body: JSON.stringify({ email, password })
});

const data = await response.json();

if (!response.ok) {
  throw new Error(data.message || 'Login failed');
}

localStorage.setItem('nexlearn_token', data.token);
localStorage.setItem('nexlearn_user', JSON.stringify(data.user));

      // Redirect based on role
      const role = data.user.role;
      if (role === 'admin') window.location.href = '/pages/admin-dashboard.html';
      else if (role === 'teacher') window.location.href = '/pages/teacher-dashboard.html';
      else window.location.href = '/pages/student-dashboard.html';
    } catch (error) {
      errorMsg.textContent = error.message || 'Login failed. Please check your credentials.';
      errorMsg.classList.remove('hidden');
      btnText.textContent = 'Login';
      btnSpinner.classList.add('hidden');
    }
  });

  // Redirect if already logged in
  const user = JSON.parse(localStorage.getItem('nexlearn_user'));
const token = localStorage.getItem('nexlearn_token');

if (user && token) {
  if (user.role === 'admin')
    window.location.href = '/pages/admin-dashboard.html';
  else if (user.role === 'teacher')
    window.location.href = '/pages/teacher-dashboard.html';
  else
    window.location.href = '/pages/student-dashboard.html';
}
</script>
</body>
</html>
